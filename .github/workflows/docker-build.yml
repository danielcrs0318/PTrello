name: Docker Build - Construcción de Imágenes

on:
  workflow_dispatch: # Ejecución manual
  push:
    branches: ["main", "master"]
    paths: # Solo ejecutar si hay cambios relevantes
      - 'backend/**'
      - 'frontend/**'
      - 'docker-compose*.yml'
      - '.github/workflows/docker-build.yml'

jobs:
  build-images:
    name: Construir Imágenes Docker
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Backend Dev
            context: ./backend
            file: ./backend/Dockerfile.dev
            tag: ptrello-backend:dev
            
          - name: Backend Prod
            context: ./backend
            file: ./backend/Dockerfile.prod
            tag: ptrello-backend:prod
            
          - name: Frontend Dev
            context: ./frontend
            file: ./frontend/Dockerfile.dev
            tag: ptrello-frontend:dev
            build-args: VITE_API_URL=http://localhost:3000
            
          - name: Frontend Prod
            context: ./frontend
            file: ./frontend/Dockerfile.prod
            tag: ptrello-frontend:prod
            build-args: VITE_API_URL=http://localhost:3000

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: ${{ matrix.tag }}
          build-args: ${{ matrix.build-args }}
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tag }}

      - name: ✅ Imagen construida
        run: |
          echo "✅ Imagen ${{ matrix.name }} construida correctamente"
          echo "🏷️ Tag: ${{ matrix.tag }}"

  test-compose:
    name: Validar Docker Compose
    runs-on: ubuntu-latest
    needs: build-images

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Validar archivos de compose
        run: |
          echo "🔍 Validando archivos Docker Compose..."
          
          if [ -f "docker-compose.local.yml" ]; then
            docker compose -f docker-compose.local.yml config > /dev/null
            echo "✅ docker-compose.local.yml validado"
          fi
          
          if [ -f "docker-compose.prod.yml" ]; then
            docker compose -f docker-compose.prod.yml config > /dev/null
            echo "✅ docker-compose.prod.yml validado"
          fi
          
          echo ""
          echo "✅ Todos los archivos Docker están correctamente configurados"
