name: CI - Validación Continua

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch: # Permite ejecutar manualmente desde GitHub

env:
  NODE_VERSION: '20'

jobs:
  # Job 1: Validar backend
  test-backend:
    name: Validar Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Verificar sintaxis de archivos JavaScript
        working-directory: backend
        run: |
          echo "🔍 Verificando archivos JavaScript..."
          find src -name "*.js" -type f -exec node -c {} \;
          echo "✅ Todos los archivos tienen sintaxis válida"

      - name: Verificar estructura de archivos críticos
        working-directory: backend
        run: |
          echo "🔍 Verificando estructura del backend..."
          test -f src/index.js && echo "✅ index.js existe"
          test -f package.json && echo "✅ package.json existe"
          test -d src/modelos && echo "✅ Directorio modelos existe"
          test -d src/rutas && echo "✅ Directorio rutas existe"
          test -d src/controladores && echo "✅ Directorio controladores existe"
          test -d src/configuraciones && echo "✅ Directorio configuraciones existe"
          test -d src/servicios && echo "✅ Directorio servicios existe"
          echo "✅ Estructura del backend válida"

      - name: Verificar archivo .env.example (si existe)
        working-directory: backend
        run: |
          if [ -f ".env.example" ]; then
            echo "✅ Archivo .env.example encontrado"
          else
            echo "⚠️ No se encontró archivo .env.example"
          fi
        continue-on-error: true

      - name: Ejecutar tests (si existen)
        working-directory: backend
        run: |
          if grep -q "\"test\":" package.json 2>/dev/null; then
            echo "🧪 Ejecutando tests..."
            npm test || echo "⚠️ Tests fallaron"
          else
            echo "ℹ️ No hay tests configurados"
          fi
        continue-on-error: true

  # Job 2: Validar frontend
  test-frontend:
    name: Validar Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias del frontend
        working-directory: frontend
        run: npm ci

      - name: Construir aplicación frontend
        working-directory: frontend
        run: npm run build
        env:
          CI: true

      - name: Verificar que el build se generó correctamente
        working-directory: frontend
        run: |
          if [ -d "dist" ]; then
            echo "✅ Build generado correctamente"
            echo "📦 Tamaño del build:"
            du -sh dist/
            echo "📦 Archivos generados:"
            ls -lah dist/ | head -20
          else
            echo "❌ Error: No se generó el directorio dist"
            exit 1
          fi

      - name: Verificar estructura de archivos críticos
        working-directory: frontend
        run: |
          echo "🔍 Verificando estructura del frontend..."
          test -f index.html && echo "✅ index.html existe"
          test -f package.json && echo "✅ package.json existe"
          test -d src && echo "✅ Directorio src existe"
          test -f vite.config.js && echo "✅ vite.config.js existe"
          test -f tailwind.config.js && echo "✅ tailwind.config.js existe"
          echo "✅ Estructura del frontend válida"

      - name: Subir artefacto del build
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  # Job 3: Validar construcción de contenedores Docker
  test-docker:
    name: Validar Docker
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - name: backend-dev
            dockerfile: backend/Dockerfile.dev
            context: backend
          - name: backend-prod
            dockerfile: backend/Dockerfile.prod
            context: backend
          - name: frontend-dev
            dockerfile: frontend/Dockerfile.dev
            context: frontend
          - name: frontend-prod
            dockerfile: frontend/Dockerfile.prod
            context: frontend

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir imagen Docker - ${{ matrix.service.name }}
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: false
          tags: ptrello-${{ matrix.service.name }}:test
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}

      - name: ✅ Imagen construida exitosamente
        run: echo "✅ Imagen ${{ matrix.service.name }} construida correctamente"

  # Job 4: Validar Docker Compose
  test-docker-compose:
    name: Validar Docker Compose
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Validar docker-compose.local.yml
        run: |
          echo "🔍 Validando docker-compose.local.yml..."
          if [ -f "docker-compose.local.yml" ]; then
            docker compose -f docker-compose.local.yml config > /dev/null
            echo "✅ docker-compose.local.yml es válido"
          else
            echo "⚠️ docker-compose.local.yml no existe"
            exit 1
          fi

      - name: Validar docker-compose.prod.yml
        run: |
          echo "🔍 Validando docker-compose.prod.yml..."
          if [ -f "docker-compose.prod.yml" ]; then
            docker compose -f docker-compose.prod.yml config > /dev/null
            echo "✅ docker-compose.prod.yml es válido"
          else
            echo "⚠️ docker-compose.prod.yml no existe"
            exit 1
          fi

  # Job final: Resumen de resultados
  summary:
    name: Resumen de CI
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend, test-docker, test-docker-compose]
    if: always()

    steps:
      - name: Resultado del CI
        run: |
          echo "================================================"
          echo "         RESUMEN DE VALIDACIÓN CONTINUA         "
          echo "================================================"
          echo ""
          echo "🔧 Backend: ${{ needs.test-backend.result }}"
          echo "🎨 Frontend: ${{ needs.test-frontend.result }}"
          echo "🐳 Docker: ${{ needs.test-docker.result }}"
          echo "📦 Docker Compose: ${{ needs.test-docker-compose.result }}"
          echo ""
          echo "================================================"
          
          if [ "${{ needs.test-backend.result }}" == "success" ] && \
             [ "${{ needs.test-frontend.result }}" == "success" ] && \
             [ "${{ needs.test-docker.result }}" == "success" ] && \
             [ "${{ needs.test-docker-compose.result }}" == "success" ]; then
            echo "✅ TODOS LOS TESTS PASARON EXITOSAMENTE"
            echo ""
            echo "El proyecto está listo para:"
            echo "  - 🚀 Despliegue"
            echo "  - 🔄 Merge a rama principal"
            echo "  - 📦 Construcción de imágenes de producción"
            exit 0
          else
            echo "❌ ALGUNOS TESTS FALLARON - Revisa los detalles arriba"
            exit 1
          fi

