name: ci-sprintflowGitActions

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: npm install 2>&1 | tee ../backend-install.log

      - name: Install frontend
        working-directory: frontend
        run: npm install 2>&1 | tee ../frontend-install.log

      - name: Build frontend
        working-directory: frontend
        run: npm run build 2>&1 | tee ../frontend-build.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-logs
          path: |
            backend-install.log
            frontend-install.log
            frontend-build.log
