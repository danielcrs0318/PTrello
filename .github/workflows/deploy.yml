name: Deploy - Despliegue Automático a Servidor

on:
  workflow_run:
    workflows: ["Build & Push - Construcción y Publicación de Imágenes"]
    types:
      - completed
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production Server
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}

    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔐 Configurar SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: 📦 Copiar docker-compose.prod.yml al servidor
        run: |
          scp -i ~/.ssh/id_ed25519 \
            docker-compose.prod.yml \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}:/opt/ptrello/

      - name: 🚀 Ejecutar deployment en servidor
        run: |
          ssh -i ~/.ssh/id_ed25519 \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} \
            'bash -s' << 'ENDSSH'
          
          set -e
          
          echo "🚀 Iniciando deployment en producción..."
          echo "================================================"
          
          cd /opt/ptrello
          
          # Verificar que existe el archivo .env.production
          if [ ! -f .env.production ]; then
            echo "❌ Error: No existe el archivo .env.production"
            exit 1
          fi
          
          # Login a Docker Hub (opcional, para límites de rate)
          # docker login -u molinacont18 -p "$DOCKERHUB_TOKEN"
          
          # Descargar nuevas imágenes
          echo "📦 Descargando imágenes actualizadas..."
          docker compose -f docker-compose.prod.yml pull
          
          # Detener contenedores actuales
          echo "🛑 Deteniendo contenedores actuales..."
          docker compose -f docker-compose.prod.yml down
          
          # Iniciar contenedores con nuevas imágenes
          echo "▶️  Iniciando contenedores actualizados..."
          docker compose -f docker-compose.prod.yml up -d
          
          # Esperar a que los contenedores estén listos
          echo "⏳ Esperando que los servicios estén listos..."
          sleep 10
          
          # Verificar estado de contenedores
          echo ""
          echo "📊 Estado de contenedores:"
          docker compose -f docker-compose.prod.yml ps
          
          # Verificar logs recientes del backend
          echo ""
          echo "📋 Últimos logs del backend:"
          docker compose -f docker-compose.prod.yml logs --tail=20 backend
          
          # Limpiar imágenes antiguas
          echo ""
          echo "🧹 Limpiando imágenes y volúmenes no utilizados..."
          docker image prune -af
          docker volume prune -f
          
          echo ""
          echo "================================================"
          echo "✅ Deployment completado exitosamente!"
          echo "================================================"
          
          ENDSSH

      - name: 🏥 Health Check
        run: |
          echo "🔍 Verificando que la aplicación responde..."
          
          # Esperar un momento adicional
          sleep 5
          
          # Hacer health check (adaptar según tu endpoint)
          response=$(curl -s -o /dev/null -w "%{http_code}" http://${{ secrets.SERVER_HOST }}/api || echo "000")
          
          if [ "$response" = "200" ] || [ "$response" = "404" ]; then
            echo "✅ Servidor responde correctamente (HTTP $response)"
          else
            echo "⚠️  Servidor responde con código: $response"
            echo "Revisa los logs en el servidor"
          fi

      - name: 🧹 Limpiar archivos temporales
        if: always()
        run: |
          rm -f ~/.ssh/id_ed25519

      - name: ✅ Deployment finalizado
        run: |
          echo "================================================"
          echo "    DEPLOYMENT COMPLETADO                       "
          echo "================================================"
          echo ""
          echo "🌐 Aplicación desplegada en: http://${{ secrets.SERVER_HOST }}"
          echo "🐳 Imágenes utilizadas:"
          echo "   - molinacont18/ptrello-backend:latest"
          echo "   - molinacont18/ptrello-frontend:latest"
          echo ""
          echo "📊 Para ver logs en vivo:"
          echo "   ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }}"
          echo "   cd /opt/ptrello"
          echo "   docker compose -f docker-compose.prod.yml logs -f"
          echo ""
          echo "================================================"

  notify-failure:
    name: Notificar Fallo
    runs-on: ubuntu-latest
    needs: deploy
    if: failure()

    steps:
      - name: ❌ Deployment falló
        run: |
          echo "================================================"
          echo "    ⚠️  DEPLOYMENT FALLIDO                     "
          echo "================================================"
          echo ""
          echo "El deployment no se completó correctamente."
          echo "Revisa los logs arriba para más detalles."
          echo ""
          echo "Acciones sugeridas:"
          echo "  1. Verifica la conexión SSH al servidor"
          echo "  2. Revisa que los secrets estén configurados"
          echo "  3. Verifica el estado del servidor"
          echo "  4. Revisa los logs del servidor manualmente"
          echo ""
          echo "================================================"
          exit 1
