version: "3.9"

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: ptrello_frontend_local
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: ptrello_backend_local
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - uploads:/app/public/img/projects
      - /app/node_modules
    env_file:
      - .env.local

volumes:
  uploads:
